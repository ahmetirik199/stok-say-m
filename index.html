<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Stok Sayım</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sayım">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#f3f4f6;color:#111}
  #top{position:sticky;top:0;z-index:5;background:#1e3a5f;color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
  #top .l1{display:flex;justify-content:space-between;align-items:center;font-weight:600}
  #bar{height:6px;background:#ffffff40;border-radius:3px;margin:6px 0}
  #bar div{height:100%;background:#4ade80;border-radius:3px;width:0}
  #search{width:100%;padding:10px;font-size:17px;border:0;border-radius:8px}
  .chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
  .chip{background:#ffffff30;color:#fff;border:0;border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap}
  .chip.on{background:#fff;color:#1e3a5f;font-weight:600}
  #raf{padding:6px;font-size:14px;border-radius:8px;border:0;max-width:140px}
  .shelf{position:sticky;top:var(--th,150px);background:#dbe4ee;padding:6px 12px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;z-index:2}
  .item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #e5e7eb}
  .item.done{background:#f0fdf4}
  .item.diff{background:#fef2f2}
  .item.flag{box-shadow:inset 4px 0 0 #f59e0b}
  .info{flex:1;min-width:0}
  .code{font-weight:700;font-size:17px}
  .name{font-size:13px;color:#4b5563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sys{font-size:12px;color:#1e3a5f;margin-top:2px}
  .qty{width:84px;padding:10px;font-size:20px;text-align:center;border:2px solid #9ca3af;border-radius:8px}
  .item.done .qty{border-color:#16a34a}
  .item.diff .qty{border-color:#dc2626}
  .fl{background:none;border:0;font-size:22px;opacity:.3;padding:4px}
  .fl.on{opacity:1}
  #welcome{padding:30px 20px;text-align:center}
  #welcome button,.big{background:#1e3a5f;color:#fff;border:0;border-radius:10px;padding:14px 22px;font-size:17px;margin:8px}
  #menu{display:none;position:fixed;inset:0;background:#0008;z-index:10}
  #menu div{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 50px);background:#fff;border-radius:10px;padding:8px;min-width:230px}
  #menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:14px;font-size:17px;border-bottom:1px solid #eee}
  #empty{padding:30px;text-align:center;color:#6b7280}
  #hdrBtn{background:none;border:0;color:#fff;font-size:24px}
</style>
</head>
<body>
<div id="welcome" style="display:none">
  <h2>Stok Sayım</h2>
  <p>Sana gönderilen <b>sayim_….json</b> dosyasını seç.</p>
  <button onclick="document.getElementById('file').click()">Sayım dosyasını yükle</button>
</div>
<div id="app" style="display:none">
  <div id="top">
    <div class="l1"><span id="who">–</span><span id="prog">0/0</span><button id="hdrBtn">☰</button></div>
    <div id="bar"><div></div></div>
    <input id="search" type="search" placeholder="Stok kodu veya ürün adı ara" autocomplete="off" autocapitalize="off" autocorrect="off">
    <div class="chips">
      <button class="chip on" data-f="all">Hepsi</button>
      <button class="chip" data-f="todo">Sayılmadı</button>
      <button class="chip" data-f="diff">Fark</button>
      <button class="chip" data-f="flag">⚑ Tekrar</button>
      <select id="raf"><option value="">Tüm raflar</option></select>
    </div>
  </div>
  <div id="list"></div>
  <div id="empty" style="display:none">Sonuç yok</div>
</div>
<div id="menu"><div>
  <button id="mShare">📤 Sonucu gönder / kaydet</button>
  <button id="mLoad">📂 Yeni dosya yükle</button>
  <button id="mReset">🗑 Sayımı sıfırla</button>
</div></div>
<input type="file" id="file" accept=".json,application/json" style="display:none">
<script src="app.js"></script>
</body>
</html>
